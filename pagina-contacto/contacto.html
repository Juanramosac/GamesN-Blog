<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>contáctanos</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="../style.css">
</head>
<body>

  <nav-bar></nav-bar>

  <!-- contenedor-->
  <main class="container-fluid mt-4"> 
    <div class="row"> 
      
      <aside class="col-md-3 "> 
        <div class="publicidad"> 
          <p class="text-center">Publicidad</p>
          <!-- Espacio para publicidad  --> 
        </div> 
      </aside> 
      
            <section class="col-md-6 d-flex justify-content-center"> 
              <div class="contacto-card w-100" style="max-width: 500px;"> 
                <h2 class="text-center mb-4">Contáctanos</h2> 
              
                <form id="formContacto"> 
                  <!-- Campo de email --> 
                  <div class="mb-3">
                    <label for="email" class="form-label">Correo Electrónico</label>
                    <input type="email" class="form-control" id="email" placeholder="ejemplo@correo.com" required> 
                  </div> 
                  
                  <!-- Campo de mensaje --> 
                  <div class="mb-3"> 
                    <label for="mensaje" class="form-label">Mensaje</label> 
                    <textarea class="form-control" id="mensaje" rows="5" placeholder="Escribe tu mensaje..." required></textarea> 
                  </div> 
                  
                  <!-- Botón centrado -->
                  <div class="text-center">
                    <button type="submit" class="btn btn-primary px-4">Enviar</button> 
                  </div>
                </form> 
                
                <!-- Alerta --> 
                <div id="alertaMensaje" class="alert alert-success alert-dismissible fade mt-4" role="alert"> 
                  Mensaje enviado
                  <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Cerrar"></button> 
                </div> 

              </div> 
            </section>
    
      <aside class="col-md-3"> 
        <div class="noticias"> 
          <p class="text-center" >Noticias</p>
          <!-- Espacio para noticias -->
        </div> 
      </aside> 

    </div> 
  </main>
||<custom-footer></custom-footer>
  <script type="module" src="../footer/footer-loader.js"></script>
  <script src="contacto.js"></script>
  <script type="module" src="../navbar/nav-loader.js"></script>
</body>
</html>
